</script><script id="item-arrow-navigation">
window.addEventListener('DOMContentLoaded',()=>{
 const main=document.querySelector('#main');
 const itemSelector='button[data-package-index],button[data-food-id],button[data-spell],button.hunt-item';
 function markCurrent(button){
  main.querySelectorAll(itemSelector).forEach(item=>{
   const active=item===button;
   item.classList.toggle('keyboard-current',active);
   if(active)item.setAttribute('aria-current','true');else item.removeAttribute('aria-current');
  });
 }
 main.addEventListener('click',event=>{
  const button=event.target.closest(itemSelector);
  if(!button||button.disabled)return;
  markCurrent(button);
  button.focus({preventScroll:true});
 });
 main.addEventListener('keydown',event=>{
  if(event.altKey||event.ctrlKey||event.metaKey||event.shiftKey)return;
  if(!['ArrowUp','ArrowDown','Home','End'].includes(event.key))return;
  if(event.target.closest('input,textarea,select,[contenteditable="true"]'))return;
  const current=event.target.closest(itemSelector);
  if(!current)return;
  const container=current.closest('tbody,.spell-list,.hunt-item-list');
  if(!container)return;
  const buttons=[...container.querySelectorAll(itemSelector)].filter(button=>!button.disabled);
  const index=buttons.indexOf(current);
  if(index<0||!buttons.length)return;
  event.preventDefault();
  const nextIndex=event.key==='Home'?0:event.key==='End'?buttons.length-1:Math.max(0,Math.min(buttons.length-1,index+(event.key==='ArrowDown'?1:-1)));
  const next=buttons[nextIndex];
  if(next!==current)next.click();
  next.focus({preventScroll:true});
  next.scrollIntoView({block:'nearest',inline:'nearest',behavior:'instant'});
 });
});

  });

   if(matchMedia('(prefers-reduced-motion: reduce)').matches){video.autoplay=false;video.pause();}
  });
 };
 improve(document);
 const scope=document.querySelector('.layout');
 if(scope)new MutationObserver(records=>{
  for(const record of records)for(const node of record.addedNodes)if(node.nodeType===1)improve(node.parentElement||node);
 }).observe(scope,{childList:true,subtree:true});
 document.addEventListener('visibilitychange',()=>{
  document.querySelectorAll('video').forEach(video=>{

  });
 });
});
